<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Calculator</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .calc-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="calc-card">
    <h2>JS Calculator</h2>
    <input type="number" id="num1" placeholder="Num 1">
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" id="num2" placeholder="Num 2">
    <button onclick="calculate()">Calculate</button>
    <div id="result">Result: --</div>
</div>

<script>
    function calculate() {
        const n1 = parseFloat(document.getElementById('num1').value);
        const n2 = parseFloat(document.getElementById('num2').value);
        const op = document.getElementById('operator').value;
        const display = document.getElementById('result');

        if (isNaN(n1) || isNaN(n2)) {
            display.innerText = "Please enter valid numbers";
            return;
        }

        let res;
        switch (op) {
            case '+': res = n1 + n2; break;
            case '-': res = n1 - n2; break;
            case '*': res = n1 * n2; break;
            case '/': res = n2 !== 0 ? n1 / n2 : "Error: Div by 0"; break;
        }
        display.innerText = "Result: " + res;
    }
</script>

</body>
</html>
